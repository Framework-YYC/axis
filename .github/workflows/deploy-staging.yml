# Deploys the STAGING Worker. Production has no workflow here on purpose: it needs the owner's explicit approval.
#
# Public-repository rules this file enforces:
#  - Trigger is a push to `staging` or a manual run. Never `pull_request` / `pull_request_target`, so fork code never gets credentials.
#  - The job only runs for this repository and only for refs/heads/staging, even when started manually.
#  - Credentials live ONLY in the GitHub environment `staging` (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID). That environment must be
#    restricted to the `staging` branch (Settings > Environments > staging > Deployment branches). Nothing is stored in the repository.
#  - Read-only repository token, no persisted git credentials, lifecycle scripts disabled, actions pinned to commit SHAs.
name: Deploy staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    if: github.repository == 'Framework-YYC/axis' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test

  deploy:
    name: Migrate and deploy staging
    needs: test
    if: github.repository == 'Framework-YYC/axis' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Require deploy credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Environment 'staging' is missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID (see docs/STAGING_DEPLOYMENT.md)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Apply additive D1 migrations (staging database only)
        run: npx wrangler d1 migrations apply AXIS_DB --remote --env staging
      - name: Deploy Worker and static assets (staging environment only)
        run: npx wrangler deploy --env staging
      - name: Smoke test, nothing may be publicly readable
        run: |
          for path in / /api/v1/me /api/v1/tasks /mcp /assets/index.js; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://axis-staging.frameworktools.ca$path" || echo 000)
            echo "GET $path -> $code"
            if [ "$code" = "200" ]; then echo "::error::$path is readable without authentication"; exit 1; fi
          done
